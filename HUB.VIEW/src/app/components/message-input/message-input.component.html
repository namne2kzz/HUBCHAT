<div class="composer">
  <div class="composer-box" [class.composer-box-active]="canSend()" [class.composer-box-code]="codeMode()">

    <!-- ── Formatting toolbar ─────────────────────────────────────────────── -->
    <div class="composer-toolbar">
      <button type="button" class="fmt-btn" (click)="bold()" title="Bold"><b>B</b></button>
      <button type="button" class="fmt-btn" (click)="italic()" title="Italic"><i>I</i></button>
      <button type="button" class="fmt-btn" (click)="strike()" title="Strikethrough"><s>S</s></button>
      <span class="fmt-sep"></span>
      <button type="button" class="fmt-btn" (click)="link()" title="Link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      </button>
      <button type="button" class="fmt-btn" (click)="bullet()" title="Bulleted list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      </button>
      <button type="button" class="fmt-btn" (click)="numbered()" title="Numbered list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4M4 10h2M6 18H4l2-2.5V15H4"/></svg>
      </button>
      <button type="button" class="fmt-btn" (click)="quote()" title="Quote">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M10 8h8M10 12h8M10 16h5"/></svg>
      </button>
      <button type="button" class="fmt-btn" (click)="inlineCode()" title="Inline code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </button>
      <button type="button" class="fmt-btn" [class.fmt-btn-active]="codeMode()" (click)="toggleCodeBlock()" title="Code block (```)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="9 10 7 12 9 14"/><polyline points="15 10 17 12 15 14"/></svg>
      </button>
    </div>

    <!-- ── Code-block header ──────────────────────────────────────────────── -->
    @if (codeMode()) {
      <div class="code-header">
        <span class="code-badge">Code block</span>
        <input class="code-lang" [value]="codeLang()" (input)="onCodeLang($event)"
               placeholder="language (optional)" spellcheck="false" />
        <button type="button" class="code-exit" (click)="toggleCodeBlock()" title="Exit code block">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    }

    <!-- ── Input row ──────────────────────────────────────────────────────── -->
    <div class="composer-row">
      <textarea
        #ta
        [value]="body()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        [class.mono]="codeMode()"
        [placeholder]="codeMode() ? 'Type your code…' : ('Message #' + channelName())"
        rows="1"
        class="composer-input"
        aria-label="Message input"
      ></textarea>

      <button
        (click)="submit()"
        [disabled]="!canSend()"
        class="send-btn"
        [class.send-btn-ready]="canSend()"
        title="Send message">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div>
  <div class="composer-foot">
    <p class="composer-hint">
      {{ codeMode() ? 'Ctrl+Enter to send · Enter for new line' : 'Enter to send · Shift+Enter for new line' }}
    </p>
    @if (remaining() <= 100) {
      <span class="composer-count" [class.composer-count-max]="remaining() <= 0">
        {{ body().length }}/{{ MAX_LEN }}
      </span>
    }
  </div>

  @if (limitHit()) {
    <p class="composer-limit-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      Message limited to {{ MAX_LEN }} characters — the extra text was trimmed.
    </p>
  }
</div>
