<aside class="thread-panel">
  <header class="thread-header">
    <div class="thread-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>Thread</span>
      @if (replyCount() > 0) { <span class="thread-sub">· {{ replyCount() }} {{ replyCount() === 1 ? 'reply' : 'replies' }}</span> }
    </div>
    <button type="button" class="thread-close" (click)="close.emit()" title="Close thread" aria-label="Close thread">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="thread-body">
    <app-message-list
      [messages]="messages()"
      [authors]="authors()"
      [currentUserId]="currentUserId()"
      [canReact]="canPost()"
      [canModerate]="canModerate()"
      (toggleReaction)="onToggleReaction($event)"
      (editMessage)="onEditMessage($event)"
      (deleteMessage)="onDeleteMessage($event)" />
  </div>

  @if (canPost()) {
    <div class="thread-composer">
      <app-message-input [channelName]="channelName()" (send)="sendReply($event)" />
    </div>
  } @else {
    <div class="thread-readonly">Join the channel to reply.</div>
  }
</aside>
