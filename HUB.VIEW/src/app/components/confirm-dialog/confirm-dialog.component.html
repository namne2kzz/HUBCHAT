@if (req(); as r) {
  <div class="cd-backdrop" (click)="cancel()"></div>

  <div class="cd-modal" role="alertdialog" aria-modal="true" [attr.aria-label]="r.title">
    <div class="cd-body">
      @if (icon() !== 'none') {
        <div class="cd-icon" [class]="'cd-icon-' + tone()">
          @switch (icon()) {
            @case ('danger') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
            @case ('warning') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
            @case ('success') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            }
            @case ('info') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            }
            @default {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
          }
        </div>
      }

      <div class="cd-text">
        <p class="cd-title">{{ r.title }}</p>
        @if (r.description) {
          <p class="cd-desc">{{ r.description }}</p>
        }
      </div>
    </div>

    <div class="cd-actions">
      <button type="button" class="cd-btn cd-btn-ghost" (click)="cancel()">
        {{ r.cancelText ?? 'Cancel' }}
      </button>
      <button type="button" class="cd-btn" [class]="'cd-btn-' + tone()" (click)="confirm()">
        {{ r.confirmText ?? 'Confirm' }}
      </button>
    </div>
  </div>
}
