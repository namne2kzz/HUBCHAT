<div class="space-y-0.5">
  @for (ch of channels(); track ch.id) {
    <div (click)="channelClick.emit(ch.id)" class="chan-row">
      <div class="chan-hash">#</div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-strong truncate">{{ ch.name }}</p>
        @if (ch.topic) {
          <p class="text-xs truncate" style="color:var(--text-muted)">{{ ch.topic }}</p>
        } @else if (ch.linkExternalKey) {
          <p class="text-xs truncate chan-link">🔗 {{ ch.linkExternalKey }}</p>
        }
      </div>
      <span class="text-xs" style="color:var(--text-muted)">{{ ch.memberCount }} 👤</span>
    </div>
  }
</div>
