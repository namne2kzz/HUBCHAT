name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HUB.slnx

      - name: Build
        run: dotnet build HUB.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HUB.slnx --configuration Release --no-build --verbosity normal

  docker-images:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -f src/Gateway/HUB.Gateway/Dockerfile -t hub-gateway:${{ github.sha }} .
      - name: Build dashboard-gateway image
        run: docker build -f src/Services/DashboardGateway/HUB.DashboardGateway/Dockerfile -t hub-dashboard-gateway:${{ github.sha }} .
      # TODO: trivy scan + push to GHCR/Docker Hub, then deploy over SSH (docker compose pull && up -d)
